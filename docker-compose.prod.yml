# RespiraAlly Production Environment
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

version: '3.8'

services:
  # Backend API - Production Mode
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runner  # Use optimized runner stage
    container_name: respirally-backend-prod
    environment:
      # Database Configuration - Production Schema
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DB_SCHEMA: production  # Use production schema

      # Application Settings
      ENVIRONMENT: production
      DEBUG: "false"
      LOG_LEVEL: INFO

      # JWT Settings (use strong secrets in production)
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7

      # CORS Settings (restrictive for production)
      CORS_ORIGINS: ${CORS_ORIGINS:-https://respirally.com,https://www.respirally.com}

      # Redis Configuration
      REDIS_URL: redis://redis:6379/0

      # RabbitMQ Configuration
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/

      # MinIO Configuration (optional)
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "8000:8000"
    command: uvicorn src.respira_ally.main:app --host 0.0.0.0 --port 8000 --workers 4 --loop uvloop --http httptools
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    networks:
      - respirally-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Dashboard - Production Mode
  dashboard:
    build:
      context: ./frontend/dashboard
      dockerfile: Dockerfile
      target: runner  # Use optimized runner stage
    container_name: respirally-dashboard-prod
    environment:
      # Next.js Configuration
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.respirally.com/api/v1}
      NEXT_TELEMETRY_DISABLED: 1
      PORT: 3000
      HOSTNAME: "0.0.0.0"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - respirally-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # LIFF App - Production Mode (nginx serving static files)
  liff:
    build:
      context: ./frontend/liff
      dockerfile: Dockerfile
      target: runner  # Use nginx runner stage
    container_name: respirally-liff-prod
    environment:
      # These are baked into the build, but listed for documentation
      # VITE_API_BASE_URL: Set during build
      # VITE_LIFF_ID: Set during build
      # VITE_MOCK_MODE: false
      NGINX_HOST: localhost
      NGINX_PORT: 5173
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5173/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    networks:
      - respirally-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  respirally-network:
    external: true
