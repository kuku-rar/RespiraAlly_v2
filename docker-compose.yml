version: '3.8'

services:
  # PostgreSQL Database with pgvector extension
  postgres:
    image: pgvector/pgvector:pg15
    container_name: respirally-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--auth-host=md5"  # Use MD5 for password authentication
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # FIXME: WSL mount issue - temporarily disabled, will run manually
      - ./database/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - respirally-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: respirally-redis
    ports:
      - "16379:6379"  # Use 16379 to avoid port conflict
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - respirally-network

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: respirally-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - respirally-network

  # MinIO Object Storage (S3-compatible)
  # 📁 Usage: Voice file storage for Sprint 6 (AI Voice Processing)
  # 🚀 Start: docker-compose up -d minio
  # 🌐 Console: http://localhost:9001 (minioadmin/minioadmin)
  # ⏸️ Note: Not required for Sprint 2 (Patient & DailyLog API)
  minio:
    image: minio/minio:latest
    container_name: respirally-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"  # API endpoint
      - "9001:9001"  # Web console
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - respirally-network
    profiles:
      - full  # Only start with --profile full or explicitly: docker-compose up -d minio

  # Frontend and Backend services are defined in:
  # - docker-compose.dev.yml (Development environment with development schema)
  # - docker-compose.prod.yml (Production environment with production schema)
  #
  # Usage:
  #   Development: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up -d
  #   Production:  docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  backend_cache:
  dashboard_node_modules:
  dashboard_next:
  liff_node_modules:

networks:
  respirally-network:
    driver: bridge
